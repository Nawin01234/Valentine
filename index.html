<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day! 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', 'Comic Sans MS', cursive;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Valentine Theme - Pink/Red gradient */
        .valentine-bg {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #ff6b9d 100%);
        }

        /* Page System */
        .page {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            padding: 20px;
        }

        .page.active {
            display: flex;
        }

        /* Page 1 & 2 - Valentine Theme */
        .page-1, .page-2 {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #ff6b9d 100%);
        }

        /* Page 3 - Black Theme */
        .page-3 {
            background: #000000;
        }

        /* Typography */
        .title {
            font-size: 4rem;
            color: white;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .question {
            font-size: 4rem;
            color: white;
            margin-bottom: 50px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .hearts {
            font-size: 3rem;
            margin: 30px 0;
        }

        /* Countdown */
        .countdown {
            background: white;
            color: #c44569;
            padding: 25px;
            border-radius: 50%;
            font-size: 4rem;
            font-weight: bold;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Buttons Container */
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-5px);
        }

        /* Yes Button - Green */
        .btn-yes {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }

        /* No Button - Red */
        .btn-no {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            z-index: 1000;
        }

        .btn-no-placeholder {
            padding: 12px 30px;
            font-size: 1.2rem;
            visibility: hidden;
            display: none;
        }

        .btn:hover {
            transform: translateY(-5px);
        }

        /* Page 3 - Result */
        .page-3 h2 {
            font-size: 3rem;
            color: white;
            margin-bottom: 25px;
            text-align: center;
        }

        .monkey-img {
            max-width: 350px;
            height: auto;
            border-radius: 20px;
            margin: 30px 0;
        }

        .no-image {
            font-size: 1.5rem;
            color: #888;
            margin-top: 20px;
        }

        /* Heart decorations */
        .heart-deco {
            position: absolute;
            font-size: 5rem;
            opacity: 0.3;
        }

        .heart-1 { top: 10%; left: 10%; }
        .heart-2 { top: 15%; right: 15%; }
        .heart-3 { bottom: 20%; left: 15%; }
        .heart-4 { bottom: 10%; right: 10%; }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .question {
                font-size: 2.5rem;
            }
            
            .btn {
                padding: 10px 25px;
                font-size: 1rem;
            }

            .countdown {
                width: 100px;
                height: 100px;
                font-size: 3rem;
            }

            .buttons-container {
                gap: 25px;
            }

            .page-3 h2 {
                font-size: 2rem;
            }

            .monkey-img {
                max-width: 250px;
            }

            .heart-deco {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Page 1: Welcome -->
    <div class="page page-1 active" id="page1">
        <span class="heart-deco heart-1">💕</span>
        <span class="heart-deco heart-2">💖</span>
        <span class="heart-deco heart-3">💗</span>
        <span class="heart-deco heart-4">💝</span>
        
        <h1 class="title">Happy Valentine's Day!💐❤️</h1>
        <div class="countdown" id="countdown">3</div>
    </div>

    <!-- Page 2: Question -->
    <div class="page page-2" id="page2">
        <span class="heart-deco heart-1">💕</span>
        <span class="heart-deco heart-2">💖</span>
        <span class="heart-deco heart-3">💗</span>
        <span class="heart-deco heart-4">💝</span>
        
        <p class="question">Can you be my Valentine?🥺💐</p>
        <div class="buttons-container" id="buttons-container">
            <button class="btn btn-yes" id="btn-yes">yes😍</button>
            <div class="btn-no-placeholder" id="btn-no-placeholder">no😭</div>
            <button class="btn btn-no" id="btn-no">no😭</button>
        </div>
    </div>

    <!-- Page 3: Result -->
    <div class="page page-3" id="page3">
        <h2>Hahaha Really? 😂</h2>
        <h2>Wake up, you are single!</h2>
        <img src="about/ลิง.gif" alt="Monkey" class="monkey-img" id="monkey-img">
    </div>

    <script>
        let noButtonMoved = false;

        // ฟังก์ชันเปลี่ยนหน้า
        function goToPage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById('page' + pageNumber).classList.add('active');
        }

        // Countdown หน้าแรก
        function startCountdown() {
            let count = 3;
            const countdownElement = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownElement.textContent = count;
                } else {
                    clearInterval(timer);
                    goToPage(2);
                    initNoButton();
                }
            }, 1000);
        }

        // ทำให้ปุ่ม No หนีเมาส์
        function initNoButton() {
            const noButton = document.getElementById('btn-no');
            
            noButton.addEventListener('mouseenter', () => {
                moveNoButton();
            });

            noButton.addEventListener('touchstart', () => {
                moveNoButton();
            });
        }

        function moveNoButton() {
            const noButton = document.getElementById('btn-no');
            const placeholder = document.getElementById('btn-no-placeholder');
            
            // ถ้าย้ายครั้งแรก ต้องเปลี่ยนเป็น fixed position และแสดง placeholder
            if (!noButtonMoved) {
                noButton.style.position = 'fixed';
                placeholder.style.display = 'inline-block';
                noButtonMoved = true;
            }
            
            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;
            
            const maxX = window.innerWidth - buttonWidth - 20;
            const maxY = window.innerHeight - buttonHeight - 20;
            
            let newX = Math.random() * maxX;
            let newY = Math.random() * maxY;
            
            noButton.style.left = newX + 'px';
            noButton.style.top = newY + 'px';
        }

        // กด Yes
        document.getElementById('btn-yes').addEventListener('click', () => {
            // ซ่อนปุ่ม No ก่อนไปหน้า 3
            document.getElementById('btn-no').style.display = 'none';
            goToPage(3);
        });

        // ตรวจสอบรูปภาพ
        document.getElementById('monkey-img').onerror = function() {
            this.style.display = 'none';
            const noImageText = document.createElement('p');
            noImageText.innerHTML = '🐵 (ไฟล์ ลิง.gif ไม่พบ)';
            noImageText.className = 'no-image';
            this.parentNode.appendChild(noImageText);
        };

        // เริ่มต้น
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                startCountdown();
            }, 1000);
        });
    </script>
</body>
</html>
